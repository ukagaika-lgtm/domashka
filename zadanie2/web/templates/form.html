{{define "content"}}
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="POST" action="{{.Action}}" class="expense-form">
  <label>Сумма, ₽
    <input type="text" name="amount" inputmode="decimal" value="{{.Amount}}" required>
  </label>
  <label>Описание
    <input type="text" name="description" maxlength="200" value="{{.Description}}" required>
  </label>
  <label>Дата
    <input type="date" name="date" value="{{.Date}}" required>
  </label>
  <div class="buttons">
    <button type="submit">Сохранить</button>
    <a href="/expenses">Отмена</a>
  </div>
</form>
{{end}}
