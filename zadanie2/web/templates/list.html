{{define "content"}}
{{if .Expenses}}
<table>
  <thead>
    <tr><th>Дата</th><th>Описание</th><th>Сумма, ₽</th><th></th></tr>
  </thead>
  <tbody>
  {{range .Expenses}}
    <tr>
      <td>{{.Date.Format "02.01.2006"}}</td>
      <td>{{.Description}}</td>
      <td class="num">{{printf "%.2f" .Amount}}</td>
      <td class="actions">
        <a href="/expenses/{{.ID}}/edit">Изменить</a>
        <form method="POST" action="/expenses/{{.ID}}/delete"
              onsubmit="return confirm('Удалить эту трату?');">
          <button type="submit" class="danger">Удалить</button>
        </form>
      </td>
    </tr>
  {{end}}
  </tbody>
</table>
{{else}}
<p>Трат пока нет. <a href="/expenses/new">Добавьте первую</a>.</p>
{{end}}
{{end}}
