{{define "content"}}

<h2>Мои расходы</h2>

<p><a href="/expenses/new">Добавить расход</a></p>

{{if .}}
<table>
    <thead>
        <tr>
            <th>Дата</th>
            <th>Описание</th>
            <th>Сумма</th>
        </tr>
    </thead>
    <tbody>
    {{range .}}
        <tr>
            <td>{{.Date.Format "02.01.2006"}}</td>
            <td>{{.Description}}</td>
            <td>{{printf "%.2f" .Amount}} €</td>
        </tr>
    {{end}}
    </tbody>
</table>
{{else}}
<p>Расходов пока нет.</p>
{{end}}

{{end}}
